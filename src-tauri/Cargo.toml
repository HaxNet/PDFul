[package]
name = "pdful"
version = "1.2.1"
description = "PDFul: annotate, comment, sign, scan and OCR PDFs"
authors = ["Simon Wong <simon@108cap.com>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-localhost = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
